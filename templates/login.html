<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    {% extends "base.html" %}
{% block content %}

<div class="card p-4 shadow mx-auto" style="max-width:400px;">
    <h4 class="text-center mb-3">Login</h4>

    <form method="POST">
        <input class="form-control mb-2" name="username" placeholder="Username">
        <input class="form-control mb-2" name="password" type="password" placeholder="Password">
        <button class="btn btn-primary w-100">Login</button>
    </form>

    <a href="/register" class="d-block text-center mt-2">Create Account</a>
</div>

{% endblock %}
</body>

</html>
